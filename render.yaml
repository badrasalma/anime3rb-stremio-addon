services:
  - type: web
    name: anime3rb-stremio-addon
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: USE_CACHED
        value: "1"
    plan: free
