name: Update anime data cache

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: devin/deploy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cloudscraper requests

      - name: Fetch updated data
        run: python fetch_data.py
        env:
          ANIME3RB_URL: https://anime3rb.vip
          ANIME3RB_USER: ${{ secrets.ANIME3RB_USER }}
          ANIME3RB_PASS: ${{ secrets.ANIME3RB_PASS }}

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update cached anime data [skip ci]"
            git push
          fi
